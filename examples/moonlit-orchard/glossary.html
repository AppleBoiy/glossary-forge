<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonlit Orchard · Thai glossary</title>
<style>
:root{--bg:#f6f3ec;--paper:#fffdf8;--ink:#1d1b18;--muted:#6b655c;--line:#ddd6c9;--chip:#efe9dd;--accent:#7a3fb0;--ok:#1f7a6d;--warn:#b4432a;--mid:#b0861b;
  --serif:"Iowan Old Style",Palatino,Georgia,serif;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Noto Sans JP",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140f;--paper:#1d1b16;--ink:#ece6da;--muted:#a59e91;--line:#3a362e;--chip:#2a2720;--accent:#c39bf0;--ok:#4fc3ae;--warn:#f07a5c;--mid:#e2c05a}}
:root[data-theme="dark"]{--bg:#15140f;--paper:#1d1b16;--ink:#ece6da;--muted:#a59e91;--line:#3a362e;--chip:#2a2720;--accent:#c39bf0;--ok:#4fc3ae;--warn:#f07a5c;--mid:#e2c05a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 70px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:600 30px/1.2 var(--serif);margin:10px 0 4px}.sub{color:var(--muted);margin:0}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.btn{font:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}.tile b{display:block;font:600 28px/1 var(--serif)}.tile span{color:var(--muted);font-size:12.5px}
.tile.warn b{color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);min-width:220px;flex:1}
.chips button{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer;margin-right:4px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbl{border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:auto}
table{border-collapse:collapse;width:100%}th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--paper);cursor:pointer;white-space:nowrap}
td.src{font-weight:600}td.tgt{font-size:15px}
.pill{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--chip)}.pill.approved{background:var(--ok);color:#fff}.pill.rejected{background:var(--warn);color:#fff}
.cons{display:flex;align-items:center;gap:8px;min-width:150px}.cons .b{flex:1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}.cons .b i{display:block;height:100%}
.cons small{font:11px var(--mono);color:var(--muted);white-space:nowrap}
.var{display:inline-block;font-size:12px;border:1px dashed var(--warn);color:var(--warn);border-radius:6px;padding:1px 6px;margin:2px 4px 0 0}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px}.ex{font-size:12.5px;color:var(--muted);margin-top:6px;border-left:2px solid var(--line);padding-left:8px}
.ex b{color:var(--ink);font-weight:500}.note{font-size:12px;color:var(--muted)}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}td.note,th.note{display:none}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="eyebrow">Glossary · glossary-forge</div><h1 id="t">Moonlit Orchard · Thai glossary</h1><p class="sub" id="m"></p></div><button class="btn" id="theme">Theme</button></div>
<div class="tiles" id="tiles"></div>
<div class="bar"><input type="search" id="q" placeholder="Search source or target…"><div class="chips" id="st"></div><div class="chips" id="sort"></div></div>
<div class="tbl"><table><thead><tr><th data-s="source">Source</th><th data-s="target">Translation</th><th>Type</th><th>Status</th><th data-s="uses">Consistency</th><th class="note">Notes</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
const DATA={"title": "Moonlit Orchard · Thai glossary", "lang": "th", "terms": [{"source": "Moon Pear", "target": "ลูกแพร์จันทรา", "type": "item/name", "status": "candidate", "note": "name key · confidence 0.95 · coverage 100%", "uses": 4, "consistent": 3, "variants": [], "examples": [{"where": "Moonlit Orchard::Mira.Rain", "source": "The rain makes the Moon Pear trees glow.^The rain makes the Moon Pear trees glow, miss.", "target": "ฝนทำให้ต้นแพร์เรืองแสงค่ะ"}]}], "files": 1};
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T=DATA.terms;document.title=DATA.title;
const used=T.filter(t=>t.uses),incons=used.filter(t=>t.consistent<t.uses);
$("#m").textContent=`${T.length} terms · ${DATA.files} file sets scanned`;
$("#tiles").innerHTML=[[T.length,"terms"],[T.filter(t=>t.status==="approved").length,"approved"],[T.filter(t=>t.status==="candidate").length,"candidates to review"],[incons.length,"used inconsistently",1]]
 .map(([n,l,w])=>`<div class="tile${w&&n?" warn":""}"><b>${n}</b><span>${l}</span></div>`).join("");
let status="all",sortBy="issues",q="";
const sts=["all","inconsistent","candidate","approved","rejected"];
function chips(){$("#st").innerHTML=sts.map(s=>`<button data-v="${s}" aria-pressed="${s===status}">${s}</button>`).join("");
 $("#sort").innerHTML=[["issues","most issues"],["uses","most used"],["source","A–Z"]].map(([k,l])=>`<button data-k="${k}" aria-pressed="${k===sortBy}">${l}</button>`).join("");
 document.querySelectorAll("#st button").forEach(b=>b.onclick=()=>{status=b.dataset.v;chips();draw()});
 document.querySelectorAll("#sort button").forEach(b=>b.onclick=()=>{sortBy=b.dataset.k;chips();draw()});}
function draw(){
 let L=T.filter(t=>status==="all"||(status==="inconsistent"?t.consistent<t.uses:t.status===status));
 if(q)L=L.filter(t=>(t.source+" "+t.target).toLowerCase().includes(q));
 const miss=t=>t.uses-t.consistent;
 L.sort(sortBy==="issues"?(a,b)=>miss(b)-miss(a)||b.uses-a.uses:sortBy==="uses"?(a,b)=>b.uses-a.uses:(a,b)=>a.source.localeCompare(b.source));
 $("#rows").innerHTML=L.slice(0,800).map(t=>{const p=t.uses?t.consistent/t.uses:1,col=p>=.999?"var(--ok)":p>=.6?"var(--mid)":"var(--warn)";
  return `<tr><td class="src">${esc(t.source)}</td><td class="tgt">${esc(t.target)}${t.variants.length?`<div>${t.variants.map(v=>`<span class="var" title="also seen">${esc(v)}</span>`).join("")}</div>`:""}</td>
  <td><span class="note">${esc(t.type)}</span></td><td><span class="pill ${esc(t.status)}">${esc(t.status)}</span></td>
  <td>${t.uses?`<div class="cons"><div class="b"><i style="width:${p*100}%;background:${col}"></i></div><small>${t.consistent}/${t.uses}</small></div>`:`<small class="note">not used</small>`}
  ${t.examples.length?`<details><summary>${t.examples.length} string${t.examples.length>1?"s":""} without “${esc(t.target)}”</summary>${t.examples.map(e=>`<div class="ex"><b>${esc(e.where)}</b><br>${esc(e.source)}<br>${esc(e.target)}</div>`).join("")}</details>`:""}</td>
  <td class="note">${esc(t.note)}</td></tr>`}).join("")||`<tr><td colspan="6" class="note">No terms match.</td></tr>`;}
$("#q").oninput=e=>{q=e.target.value.toLowerCase();draw()};
$("#theme").onclick=()=>{const r=document.documentElement,d=matchMedia("(prefers-color-scheme: dark)").matches,c=r.dataset.theme||(d?"dark":"light");r.dataset.theme=c==="dark"?"light":"dark"};
chips();draw();
})();
</script></body></html>
